<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wave Intelligence</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --text-muted: #8b949e;
            --green: #22c55e;
            --green-dark: #16a34a;
            --green-bg: rgba(34, 197, 94, 0.2);
            --yellow: #eab308;
            --yellow-bg: rgba(234, 179, 8, 0.15);
            --red: #ef4444;
            --red-bg: rgba(239, 68, 68, 0.15);
            --blue: #3b82f6;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        
        .header {
            background: var(--card);
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            border-bottom: 1px solid var(--border);
        }
        
        .menu-btn {
            width: 20px;
            height: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .menu-btn span {
            height: 2px;
            background: var(--text);
            border-radius: 1px;
        }
        
        .coin-name { font-size: 1.1rem; font-weight: 600; }
        
        .controls {
            padding: 0.5rem 0.75rem;
            display: flex;
            gap: 0.5rem;
            background: var(--card);
            border-bottom: 1px solid var(--border);
        }
        
        .controls select {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.4rem 0.6rem;
            border-radius: 6px;
            font-size: 0.8rem;
            flex: 1;
        }
        
        .analyze-btn {
            background: var(--green);
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.8rem;
        }
        
        .chart-wrapper {
            background: var(--card);
            margin: 0.5rem;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        
        .chart-header {
            padding: 0.6rem 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }
        
        .chart-pair {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .chart-pair::before {
            content: '◆';
            color: var(--yellow);
            font-size: 0.7rem;
        }
        
        .current-price {
            background: var(--green-bg);
            color: var(--green);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-weight: 700;
            font-size: 0.9rem;
        }
        
        #chart { height: 320px; }
        
        .scenarios {
            padding: 0.5rem;
            background: var(--card);
            margin: 0 0.5rem;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        
        .scenario-row {
            display: flex;
            align-items: center;
            padding: 0.75rem;
            border-bottom: 1px solid var(--border);
        }
        
        .scenario-row:last-child {
            border-bottom: none;
        }
        
        .scenario-badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            margin-right: 0.75rem;
            min-width: 70px;
            text-align: center;
        }
        
        .badge-hoch { background: var(--green-bg); color: var(--green); }
        .badge-mittel { background: var(--yellow-bg); color: var(--yellow); }
        .badge-niedrig { background: var(--red-bg); color: var(--red); }
        
        .scenario-text {
            flex: 1;
            font-size: 0.85rem;
            color: var(--text);
        }
        
        .handelszone {
            background: var(--card);
            margin: 0.5rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
        }
        
        .handelszone-header {
            padding: 0.6rem 0.75rem;
            background: rgba(255,255,255,0.02);
            border-bottom: 1px solid var(--border);
            font-weight: 700;
            font-size: 0.9rem;
        }
        
        .handelszone-content {
            padding: 0.75rem;
        }
        
        .position-badge {
            display: inline-block;
            background: var(--green);
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }
        
        .zone-range {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--green);
            font-family: monospace;
        }
        
        .disclaimer {
            padding: 0.75rem;
            font-size: 0.7rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="menu-btn"><span></span><span></span><span></span></div>
        <div class="coin-name" id="headerCoin">Solana</div>
    </div>
    
    <div class="controls">
        <select id="symbol" onchange="updateCoin()">
            <option value="SOLUSDT" selected>Solana (SOL)</option>
            <option value="BTCUSDT">Bitcoin (BTC)</option>
            <option value="ETHUSDT">Ethereum (ETH)</option>
            <option value="BNBUSDT">BNB</option>
            <option value="XRPUSDT">XRP</option>
            <option value="LINKUSDT">Chainlink (LINK)</option>
            <option value="AVAXUSDT">Avalanche (AVAX)</option>
            <option value="NEARUSDT">NEAR Protocol</option>
            <option value="SUIUSDT">Sui (SUI)</option>
            <option value="INJUSDT">Injective (INJ)</option>
            <option value="RENDERUSDT">Render</option>
            <option value="TIAUSDT">Celestia</option>
            <option value="KASUSDT">Kaspa (KAS)</option>
        </select>
        <button class="analyze-btn" onclick="analyze()">Analysieren</button>
    </div>
    
    <div class="chart-wrapper">
        <div class="chart-header">
            <div class="chart-pair" id="chartPair">SOLUSDT</div>
            <div class="current-price" id="currentPrice">-</div>
        </div>
        <div id="chart"></div>
    </div>
    
    <div class="scenarios">
        <div class="scenario-row">
            <span class="scenario-badge badge-hoch">Hoch</span>
            <span class="scenario-text" id="scenarioHoch">Top-Bildung / fallende Kurse</span>
        </div>
        <div class="scenario-row">
            <span class="scenario-badge badge-mittel">Mittel</span>
            <span class="scenario-text" id="scenarioMittel">Nachhaltig steigende Kurse</span>
        </div>
        <div class="scenario-row">
            <span class="scenario-badge badge-niedrig">Niedrig</span>
            <span class="scenario-text" id="scenarioNiedrig">Direkter Rückgang</span>
        </div>
    </div>
    
    <div class="handelszone">
        <div class="handelszone-header">📊 Handelszone</div>
        <div class="handelszone-content">
            <span class="position-badge">LONG</span>
            <div class="zone-range" id="handelsZone">-</div>
        </div>
    </div>
    
    <div class="disclaimer">
        ⚠️ Keine Anlageberatung. Kryptowährungen sind hochspekulativ.
    </div>

    <script>
        let chart = null;
        
        const COINS = {
            'SOLUSDT': 'Solana', 'BTCUSDT': 'Bitcoin', 'ETHUSDT': 'Ethereum',
            'BNBUSDT': 'BNB', 'XRPUSDT': 'XRP', 'LINKUSDT': 'Chainlink',
            'AVAXUSDT': 'Avalanche', 'NEARUSDT': 'NEAR', 'SUIUSDT': 'Sui',
            'INJUSDT': 'Injective', 'RENDERUSDT': 'Render', 'TIAUSDT': 'Celestia', 'KASUSDT': 'Kaspa'
        };
        
        function updateCoin() {
            const sym = document.getElementById('symbol').value;
            document.getElementById('headerCoin').textContent = COINS[sym];
            document.getElementById('chartPair').textContent = sym;
        }
        
        function formatPrice(price) {
            if (price >= 10000) return '$' + Math.round(price).toLocaleString('de-DE');
            if (price >= 1000) return '$' + Math.round(price).toLocaleString('de-DE');
            if (price >= 100) return '$' + price.toFixed(2);
            if (price >= 1) return '$' + price.toFixed(3);
            return '$' + price.toFixed(5);
        }
        
        async function analyze() {
            const symbol = document.getElementById('symbol').value;
            
            try {
                // Immer 1 Woche für langfristige Ansicht wie Schulz
                const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=1w&limit=52`);
                const data = await res.json();
                
                const candles = data.map(c => ({
                    time: c[0] / 1000,
                    open: parseFloat(c[1]),
                    high: parseFloat(c[2]),
                    low: parseFloat(c[3]),
                    close: parseFloat(c[4])
                }));
                
                const price = candles[candles.length - 1].close;
                
                // Zielzonen (wie Schulz: 46k-54k bei BTC)
                const zoneLow = price * 0.75;
                const zoneHigh = price * 0.88;
                
                // Chart
                if (chart) chart.remove();
                chart = LightweightCharts.createChart(document.getElementById('chart'), {
                    layout: { 
                        background: { color: '#161b22' }, 
                        textColor: '#8b949e'
                    },
                    grid: { 
                        vertLines: { color: 'rgba(48, 54, 61, 0.5)' }, 
                        horzLines: { color: 'rgba(48, 54, 61, 0.5)' } 
                    },
                    rightPriceScale: { 
                        borderColor: '#30363d',
                        scaleMargins: { top: 0.1, bottom: 0.1 }
                    },
                    timeScale: { 
                        borderColor: '#30363d',
                        timeVisible: false,
                        tickMarkFormatter: (time) => {
                            const date = new Date(time * 1000);
                            const months = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
                            return months[date.getMonth()];
                        }
                    },
                    height: 320,
                    crosshair: { mode: 0 }
                });
                
                // HAUPTLINIE
                const mainLine = chart.addLineSeries({ 
                    color: '#e6edf3', 
                    lineWidth: 1.5,
                    lastValueVisible: false
                });
                mainLine.setData(candles.map(c => ({ time: c.time, value: c.close })));
                
                const lastTime = candles[candles.length - 1].time;
                const timeStep = candles[1].time - candles[0].time;
                const futureSteps = 20;
                const futureTime = lastTime + (timeStep * futureSteps);
                
                // GRÜNE ZIELZONEN-BOX (wie Schulz)
                const boxTop = chart.addLineSeries({ 
                    color: '#22c55e', 
                    lineWidth: 2,
                    lastValueVisible: true,
                    title: formatPrice(zoneHigh)
                });
                const boxBottom = chart.addLineSeries({ 
                    color: '#22c55e', 
                    lineWidth: 2,
                    lastValueVisible: true,
                    title: formatPrice(zoneLow)
                });
                
                boxTop.setData([
                    {time: lastTime, value: zoneHigh}, 
                    {time: futureTime, value: zoneHigh}
                ]);
                boxBottom.setData([
                    {time: lastTime, value: zoneLow}, 
                    {time: futureTime, value: zoneLow}
                ]);
                
                // WELLEN LABELS (iv) und (v)
                const pivots = [];
                for (let i = 5; i < candles.length - 5; i++) {
                    const isHigh = candles.slice(i-5, i).every(d => d.high <= candles[i].high) &&
                                  candles.slice(i+1, i+6).every(d => d.high < candles[i].high);
                    const isLow = candles.slice(i-5, i).every(d => d.low >= candles[i].low) &&
                                 candles.slice(i+1, i+6).every(d => d.low > candles[i].low);
                    if (isHigh) pivots.push({ time: candles[i].time, price: candles[i].high, type: 'high' });
                    if (isLow) pivots.push({ time: candles[i].time, price: candles[i].low, type: 'low' });
                }
                
                pivots.sort((a, b) => a.time - b.time);
                const recentPivots = pivots.slice(-3);
                
                const markers = recentPivots.map((p, idx) => ({
                    time: p.time,
                    position: p.type === 'high' ? 'aboveBar' : 'belowBar',
                    color: idx === 1 ? '#eab308' : '#22c55e',
                    shape: 'text',
                    text: ['(iii)', '(iv)', '(v)'][idx] || '(?)',
                    size: 1.5
                }));
                mainLine.setMarkers(markers);
                
                chart.timeScale().fitContent();
                
                // UI
                document.getElementById('currentPrice').textContent = formatPrice(price);
                document.getElementById('handelsZone').textContent = formatPrice(zoneLow) + ' - ' + formatPrice(zoneHigh);
                
            } catch (e) {
                console.error(e);
            }
        }
        
        window.onload = analyze;
    </script>
</body>
</html>
