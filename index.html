<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wave Intelligence</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --text-muted: #8b949e;
            --green: #238636;
            --green-light: #3fb950;
            --green-bg: rgba(35, 134, 54, 0.2);
            --yellow: #f0883e;
            --yellow-bg: rgba(240, 136, 62, 0.2);
            --red: #da3633;
            --red-bg: rgba(218, 54, 51, 0.2);
            --blue: #58a6ff;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        
        .header {
            background: var(--card);
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            border-bottom: 1px solid var(--border);
        }
        
        .menu-btn {
            width: 20px;
            height: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .menu-btn span {
            height: 2px;
            background: var(--text);
            border-radius: 1px;
        }
        
        .coin-name { font-size: 1.1rem; font-weight: 600; }
        
        .controls {
            padding: 0.5rem 0.75rem;
            display: flex;
            gap: 0.5rem;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
        }
        
        .controls select, .controls button {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.4rem 0.6rem;
            border-radius: 6px;
            font-size: 0.8rem;
        }
        
        .analyze-btn {
            background: var(--green) !important;
            border-color: var(--green) !important;
            font-weight: 600;
        }
        
        .view-toggle {
            display: flex;
            background: var(--bg);
            border-radius: 6px;
            padding: 2px;
            margin-left: auto;
        }
        
        .view-btn {
            padding: 0.3rem 0.6rem;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .view-btn.active {
            background: var(--blue);
            color: white;
        }
        
        .chart-wrapper {
            background: var(--card);
            margin: 0.5rem;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        
        .chart-header {
            padding: 0.6rem 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }
        
        .chart-pair {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .chart-pair::before {
            content: '◆';
            color: var(--yellow);
            font-size: 0.7rem;
        }
        
        .current-price {
            background: var(--green-bg);
            color: var(--green-light);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-weight: 700;
            font-size: 0.95rem;
        }
        
        #chart { height: 340px; }
        
        .position-bar {
            background: linear-gradient(90deg, rgba(88, 166, 255, 0.1), transparent);
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
        }
        
        .position-text {
            font-size: 0.85rem;
            color: var(--text);
        }
        
        .position-wave {
            color: var(--blue);
            font-weight: 700;
        }
        
        .zones-container { padding: 0.5rem; }
        
        .phase-card {
            background: var(--card);
            border-radius: 12px;
            margin-bottom: 0.5rem;
            border: 1px solid var(--border);
            overflow: hidden;
        }
        
        .phase-header {
            padding: 0.6rem 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }
        
        .phase-title {
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .phase-badge {
            font-size: 0.7rem;
            padding: 0.15rem 0.5rem;
            border-radius: 10px;
            font-weight: 600;
        }
        
        .badge-up { background: var(--green-bg); color: var(--green-light); }
        .badge-down { background: var(--red-bg); color: var(--red); }
        .badge-neutral { background: var(--yellow-bg); color: var(--yellow); }
        
        .phase-content { padding: 0.75rem; }
        
        .wave-row {
            display: flex;
            align-items: center;
            padding: 0.6rem 0;
            border-bottom: 1px solid var(--border);
        }
        
        .wave-row:last-child { border-bottom: none; }
        
        .wave-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            margin-right: 0.75rem;
        }
        
        .wave-active { background: var(--green); color: white; }
        .wave-future { background: rgba(255,255,255,0.1); color: var(--text-muted); }
        .wave-past { background: rgba(88, 166, 255, 0.3); color: var(--blue); }
        
        .wave-info { flex: 1; }
        
        .wave-name {
            font-weight: 600;
            font-size: 0.85rem;
        }
        
        .wave-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        
        .wave-target {
            text-align: right;
        }
        
        .wave-price {
            font-size: 1rem;
            font-weight: 700;
            font-family: monospace;
        }
        
        .wave-time {
            font-size: 0.7rem;
            color: var(--text-muted);
        }
        
        .target-box {
            background: linear-gradient(135deg, var(--green-bg), rgba(35, 134, 54, 0.05));
            border: 2px solid var(--green);
            border-radius: 10px;
            padding: 0.75rem;
        }
        
        .target-box.down {
            background: linear-gradient(135deg, var(--red-bg), rgba(218, 54, 51, 0.05));
            border-color: var(--red);
        }
        
        .target-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }
        
        .target-range {
            font-size: 1.3rem;
            font-weight: 700;
            font-family: monospace;
        }
        
        .target-up { color: var(--green-light); }
        .target-down { color: var(--red); }
        
        .disclaimer {
            padding: 0.75rem;
            font-size: 0.7rem;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="menu-btn"><span></span><span></span><span></span></div>
        <div class="coin-name" id="headerCoin">Solana</div>
        <div class="view-toggle">
            <button class="view-btn active" onclick="setView('short')">Kurz</button>
            <button class="view-btn" onclick="setView('long')">Lang</button>
        </div>
    </div>
    
    <div class="controls">
        <select id="symbol" onchange="updateCoin()">
            <option value="SOLUSDT" selected>SOL</option>
            <option value="BTCUSDT">BTC</option>
            <option value="ETHUSDT">ETH</option>
            <option value="XRPUSDT">XRP</option>
        </select>
        <select id="timeframe" onchange="analyze()">
            <option value="4h">4H</option>
            <option value="1d" selected>1D</option>
            <option value="1w">1W</option>
        </select>
        <button class="analyze-btn" onclick="analyze()">Analysieren</button>
    </div>
    
    <div class="position-bar">
        <div class="position-text">
            Aktuelle Position: <span class="position-wave" id="currentPosition">Welle 3 (Impuls)</span>
        </div>
    </div>
    
    <div class="chart-wrapper">
        <div class="chart-header">
            <div class="chart-pair" id="chartPair">SOLUSDT</div>
            <div class="current-price" id="currentPrice">-</div>
        </div>
        <div id="chart"></div>
    </div>
    
    <div class="zones-container" id="zonesContainer">
        <!-- Wird dynamisch gefüllt -->
    </div>
    
    <div class="disclaimer">
        ⚠️ Langfristige Prognosen basieren auf Elliott-Wellen-Theorie.<br>
        Keine Garantie. Märkte können unvorhersehbar reagieren.
    </div>

    <script>
        let chart = null;
        let currentView = 'short';
        
        const COINS = {
            'SOLUSDT': 'Solana', 'BTCUSDT': 'Bitcoin', 'ETHUSDT': 'Ethereum', 'XRPUSDT': 'XRP'
        };
        
        function setView(view) {
            currentView = view;
            document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            analyze();
        }
        
        function updateCoin() {
            const sym = document.getElementById('symbol').value;
            document.getElementById('headerCoin').textContent = COINS[sym];
            document.getElementById('chartPair').textContent = sym;
        }
        
        function formatPrice(price) {
            if (price >= 10000) return '$' + Math.round(price).toLocaleString('de-DE');
            if (price >= 1000) return '$' + Math.round(price).toLocaleString('de-DE');
            if (price >= 100) return '$' + price.toFixed(2);
            if (price >= 1) return '$' + price.toFixed(3);
            return '$' + price.toFixed(5);
        }
        
        async function analyze() {
            const symbol = document.getElementById('symbol').value;
            const tf = document.getElementById('timeframe').value;
            const limit = currentView === 'long' ? (tf === '1w' ? 200 : 730) : (tf === '1d' ? 180 : 500);
            
            try {
                const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${tf}&limit=${limit}`);
                const data = await res.json();
                
                const candles = data.map(c => ({
                    time: c[0] / 1000,
                    open: parseFloat(c[1]),
                    high: parseFloat(c[2]),
                    low: parseFloat(c[3]),
                    close: parseFloat(c[4])
                }));
                
                const price = candles[candles.length - 1].close;
                const historicalLow = Math.min(...candles.slice(0, Math.floor(candles.length/3)).map(c => c.low));
                
                // ELLIOTT WAVE ZYKLUS BERECHNUNG
                // Welle 1: Von Tief bis erstes Hoch
                const wave1Size = price * 0.3; // Vereinfacht
                const w1Target = historicalLow + wave1Size;
                const w2Target = w1Target - (wave1Size * 0.5); // 50% Retracement
                
                // Welle 3: 1.618 Extension von Welle 1
                const wave3Size = wave1Size * 1.618;
                const w3Target = w2Target + wave3Size;
                
                // Welle 4: 38.2% Retracement von Welle 3
                const w4Target = w3Target - (wave3Size * 0.382);
                
                // Welle 5: Gleich Welle 1
                const w5Target = w4Target + wave1Size;
                
                // KORREKTUR ABC
                // A: 38.2% vom Gesamtaufschwung
                const totalMove = w5Target - historicalLow;
                const zoneA = w5Target - (totalMove * 0.382);
                
                // C: 61.8% vom Gesamtaufschwung (Tiefpunkt)
                const zoneC = w5Target - (totalMove * 0.618);
                
                // Chart
                if (chart) chart.remove();
                chart = LightweightCharts.createChart(document.getElementById('chart'), {
                    layout: { background: { color: '#161b22' }, textColor: '#8b949e' },
                    grid: { vertLines: { color: 'rgba(48, 54, 61, 0.5)' }, horzLines: { color: 'rgba(48, 54, 61, 0.5)' } },
                    rightPriceScale: { borderColor: '#30363d', scaleMargins: { top: 0.1, bottom: 0.1 } },
                    timeScale: { borderColor: '#30363d', timeVisible: true },
                    height: 340
                });
                
                // Hauptlinie
                const mainLine = chart.addLineSeries({ color: '#e6edf3', lineWidth: 2, lastValueVisible: false });
                mainLine.setData(candles.map(c => ({ time: c.time, value: c.close })));
                
                // Zukunftslinien
                const lastTime = candles[candles.length - 1].time;
                const timeStep = candles[1].time - candles[0].time;
                const steps = 20;
                
                // Welle 3 Ziel (grün)
                const w3Line = chart.addLineSeries({ 
                    color: '#3fb950', lineWidth: 2, lineStyle: 0, lastValueVisible: true 
                });
                w3Line.setData([
                    {time: lastTime, value: price},
                    {time: lastTime + timeStep * steps, value: w3Target}
                ]);
                
                // Welle 5 Ziel (blau)
                const w5Line = chart.addLineSeries({ 
                    color: '#58a6ff', lineWidth: 2, lineStyle: 2, lastValueVisible: true 
                });
                w5Line.setData([
                    {time: lastTime + timeStep * steps, value: w3Target},
                    {time: lastTime + timeStep * steps * 2, value: w5Target}
                ]);
                
                // Korrektur Zone C (rot)
                const zoneCLine = chart.addLineSeries({ 
                    color: '#da3633', lineWidth: 2, lineStyle: 2, lastValueVisible: true 
                });
                zoneCLine.setData([
                    {time: lastTime + timeStep * steps * 2, value: w5Target},
                    {time: lastTime + timeStep * steps * 3, value: zoneC}
                ]);
                
                // Zielzonen als horizontale Linien
                const targets = [
                    { price: w3Target, color: 'rgba(63, 185, 80, 0.3)', label: 'W3' },
                    { price: w5Target, color: 'rgba(88, 166, 255, 0.3)', label: 'W5' },
                    { price: zoneC, color: 'rgba(218, 54, 51, 0.3)', label: 'Zone C' }
                ];
                
                targets.forEach(t => {
                    const line = chart.addLineSeries({ 
                        color: t.color, lineWidth: 1, lineStyle: 2, lastValueVisible: false 
                    });
                    line.setData([
                        {time: lastTime, value: t.price},
                        {time: lastTime + timeStep * steps * 3, value: t.price}
                    ]);
                });
                
                chart.timeScale().fitContent();
                
                // UI Updates
                document.getElementById('currentPrice').textContent = formatPrice(price);
                document.getElementById('currentPosition').textContent = 'Welle 3 (läuft)';
                
                // Zonen Container
                const zonesHtml = `
                    <div class="phase-card">
                        <div class="phase-header">
                            <span class="phase-title">📈 Impulswellen (1-5)</span>
                            <span class="phase-badge badge-up">Aufwärts</span>
                        </div>
                        <div class="phase-content">
                            <div class="wave-row">
                                <div class="wave-icon wave-past">1</div>
                                <div class="wave-info">
                                    <div class="wave-name">Welle 1</div>
                                    <div class="wave-desc">Erste Impulswelle abgeschlossen</div>
                                </div>
                                <div class="wave-target">
                                    <div class="wave-price target-up">${formatPrice(w1Target)}</div>
                                </div>
                            </div>
                            <div class="wave-row">
                                <div class="wave-icon wave-past">2</div>
                                <div class="wave-info">
                                    <div class="wave-name">Welle 2</div>
                                    <div class="wave-desc">Korrektur abgeschlossen (50% Retracement)</div>
                                </div>
                                <div class="wave-target">
                                    <div class="wave-price" style="color: var(--yellow);">${formatPrice(w2Target)}</div>
                                </div>
                            </div>
                            <div class="wave-row">
                                <div class="wave-icon wave-active">3</div>
                                <div class="wave-info">
                                    <div class="wave-name">Welle 3 ⭐</div>
                                    <div class="wave-desc">AKTIV - Stärkste Impulswelle (1.618 Extension)</div>
                                </div>
                                <div class="wave-target">
                                    <div class="wave-price target-up">${formatPrice(w3Target)}</div>
                                    <div class="wave-time">Nächstes Ziel</div>
                                </div>
                            </div>
                            <div class="wave-row">
                                <div class="wave-icon wave-future">4</div>
                                <div class="wave-info">
                                    <div class="wave-name">Welle 4</div>
                                    <div class="wave-desc">Erwartete Korrektur (38.2% Retracement)</div>
                                </div>
                                <div class="wave-target">
                                    <div class="wave-price" style="color: var(--yellow);">${formatPrice(w4Target)}</div>
                                </div>
                            </div>
                            <div class="wave-row">
                                <div class="wave-icon wave-future">5</div>
                                <div class="wave-info">
                                    <div class="wave-name">Welle 5</div>
                                    <div class="wave-desc">Finale Impulswelle zum Zyklushoch</div>
                                </div>
                                <div class="wave-target">
                                    <div class="wave-price target-up">${formatPrice(w5Target)}</div>
                                    <div class="wave-time">Zyklus-Top</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="phase-card">
                        <div class="phase-header">
                            <span class="phase-title">📉 Korrekturwellen (A-B-C)</span>
                            <span class="phase-badge badge-down">Abwärts</span>
                        </div>
                        <div class="phase-content">
                            <div class="wave-row">
                                <div class="wave-icon wave-future">A</div>
                                <div class="wave-info">
                                    <div class="wave-name">Welle A</div>
                                    <div class="wave-desc">Erste Abwärtswelle (38.2% vom Aufschwung)</div>
                                </div>
                                <div class="wave-target">
                                    <div class="wave-price target-down">${formatPrice(zoneA)}</div>
                                </div>
                            </div>
                            <div class="wave-row">
                                <div class="wave-icon wave-future">C</div>
                                <div class="wave-info">
                                    <div class="wave-name">Welle C ⭐</div>
                                    <div class="wave-desc">Tiefpunkt der Korrektur (61.8% Retracement)</div>
                                </div>
                                <div class="wave-target">
                                    <div class="wave-price target-down">${formatPrice(zoneC)}</div>
                                    <div class="wave-time">Einstiegszone</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="phase-card">
                        <div class="phase-header">
                            <span class="phase-title">🎯 Zusammenfassung</span>
                            <span class="phase-badge badge-up">Setup</span>
                        </div>
                        <div class="phase-content">
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                                <div class="target-box">
                                    <div class="target-label">Nächstes Ziel (W3)</div>
                                    <div class="target-range target-up">${formatPrice(w3Target)}</div>
                                </div>
                                <div class="target-box down">
                                    <div class="target-label">Korrekturtief (Zone C)</div>
                                    <div class="target-range target-down">${formatPrice(zoneC)}</div>
                                </div>
                            </div>
                            <div style="margin-top: 0.75rem; padding: 0.5rem; background: rgba(255,255,255,0.03); border-radius: 8px; font-size: 0.8rem; color: var(--text-muted);">
                                <strong>Strategie:</strong> Jetzt kaufen → Verkaufen bei Welle 5 (${formatPrice(w5Target)}) → Wieder einsteigen bei Zone C (${formatPrice(zoneC)})
                            </div>
                        </div>
                    </div>
                `;
                
                document.getElementById('zonesContainer').innerHTML = zonesHtml;
                
            } catch (e) {
                console.error(e);
            }
        }
        
        window.onload = analyze;
    </script>
</body>
</html>
