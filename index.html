<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wave Intelligence</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: #0a0b0f;
            --card: #111218;
            --border: #1f2129;
            --text: #ffffff;
            --text-muted: #6b7280;
            --green: #22c55e;
            --green-dark: #16a34a;
            --green-bg: rgba(34, 197, 94, 0.15);
            --yellow: #eab308;
            --yellow-bg: rgba(234, 179, 8, 0.15);
            --red: #ef4444;
            --red-bg: rgba(239, 68, 68, 0.15);
            --blue: #3b82f6;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        
        .header {
            background: var(--card);
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            border-bottom: 1px solid var(--border);
        }
        
        .menu-btn {
            width: 20px;
            height: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .menu-btn span {
            height: 2px;
            background: var(--text);
            border-radius: 1px;
        }
        
        .coin-name { font-size: 1.1rem; font-weight: 600; }
        
        .controls {
            padding: 0.5rem 0.75rem;
            display: flex;
            gap: 0.5rem;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
        }
        
        .controls select, .controls button {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.4rem 0.6rem;
            border-radius: 6px;
            font-size: 0.8rem;
        }
        
        .analyze-btn {
            background: var(--green) !important;
            border-color: var(--green) !important;
            font-weight: 600;
        }
        
        .chart-wrapper {
            background: var(--card);
            margin: 0.5rem;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        
        .chart-header {
            padding: 0.6rem 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }
        
        .chart-pair {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .chart-pair::before {
            content: '◆';
            color: var(--yellow);
            font-size: 0.7rem;
        }
        
        .current-price {
            background: var(--green-bg);
            color: var(--green);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-weight: 700;
            font-size: 0.95rem;
        }
        
        #chart { height: 350px; }
        
        .bottom-zones {
            display: flex;
            gap: 0.5rem;
            padding: 0.5rem;
            background: var(--card);
            margin: 0 0.5rem 0.5rem 0.5rem;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        
        .bottom-zone {
            flex: 1;
            padding: 0.75rem 0.5rem;
            border-radius: 10px;
            text-align: center;
        }
        
        .zone-green {
            background: linear-gradient(135deg, var(--green-bg), rgba(34, 197, 94, 0.05));
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        
        .zone-yellow {
            background: linear-gradient(135deg, var(--yellow-bg), rgba(234, 179, 8, 0.05));
            border: 1px solid rgba(234, 179, 8, 0.3);
        }
        
        .zone-red {
            background: linear-gradient(135deg, var(--red-bg), rgba(239, 68, 68, 0.05));
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        
        .zone-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }
        
        .zone-value {
            font-size: 0.95rem;
            font-weight: 700;
            font-family: monospace;
        }
        
        .zone-green .zone-value { color: var(--green); }
        .zone-yellow .zone-value { color: var(--yellow); }
        .zone-red .zone-value { color: var(--red); }
        
        .disclaimer {
            padding: 0.75rem;
            font-size: 0.7rem;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="menu-btn"><span></span><span></span><span></span></div>
        <div class="coin-name" id="headerCoin">Bitcoin</div>
    </div>
    
    <div class="controls">
        <select id="symbol" onchange="updateCoin()">
            <option value="BTCUSDT" selected>Bitcoin (BTC)</option>
            <option value="ETHUSDT">Ethereum (ETH)</option>
            <option value="SOLUSDT">Solana (SOL)</option>
            <option value="BNBUSDT">BNB</option>
            <option value="XRPUSDT">XRP</option>
            <option value="LINKUSDT">Chainlink (LINK)</option>
            <option value="AVAXUSDT">Avalanche (AVAX)</option>
            <option value="NEARUSDT">NEAR Protocol</option>
            <option value="SUIUSDT">Sui (SUI)</option>
            <option value="INJUSDT">Injective (INJ)</option>
            <option value="RENDERUSDT">Render</option>
            <option value="TIAUSDT">Celestia</option>
            <option value="KASUSDT">Kaspa (KAS)</option>
        </select>
        <select id="timeframe" onchange="analyze()">
            <option value="4h">4 Stunden</option>
            <option value="1d" selected>1 Tag</option>
            <option value="1w">1 Woche</option>
        </select>
        <button class="analyze-btn" onclick="analyze()">Analysieren</button>
    </div>
    
    <div class="chart-wrapper">
        <div class="chart-header">
            <div class="chart-pair" id="chartPair">BTCUSDT</div>
            <div class="current-price" id="currentPrice">-</div>
        </div>
        <div id="chart"></div>
    </div>
    
    <div class="bottom-zones">
        <div class="bottom-zone zone-green">
            <div class="zone-label">Zielzone</div>
            <div class="zone-value" id="zielZone">-</div>
        </div>
        <div class="bottom-zone zone-yellow">
            <div class="zone-label">Erwartungswert</div>
            <div class="zone-value" id="erwartungsWert">-</div>
        </div>
        <div class="bottom-zone zone-red">
            <div class="zone-label">Stop Loss</div>
            <div class="zone-value" id="stopLoss">-</div>
        </div>
    </div>
    
    <div class="disclaimer">
        ⚠️ Keine Anlageberatung. Kryptowährungen sind hochspekulativ.
    </div>

    <script>
        let chart = null;
        
        const COINS = {
            'BTCUSDT': 'Bitcoin', 'ETHUSDT': 'Ethereum', 'SOLUSDT': 'Solana',
            'BNBUSDT': 'BNB', 'XRPUSDT': 'XRP', 'LINKUSDT': 'Chainlink',
            'AVAXUSDT': 'Avalanche', 'NEARUSDT': 'NEAR', 'SUIUSDT': 'Sui',
            'INJUSDT': 'Injective', 'RENDERUSDT': 'Render', 'TIAUSDT': 'Celestia', 'KASUSDT': 'Kaspa'
        };
        
        function updateCoin() {
            const sym = document.getElementById('symbol').value;
            document.getElementById('headerCoin').textContent = COINS[sym];
            document.getElementById('chartPair').textContent = sym;
        }
        
        function formatPrice(price) {
            if (price >= 10000) return Math.round(price).toLocaleString('de-DE');
            if (price >= 1000) return Math.round(price).toLocaleString('de-DE');
            if (price >= 100) return price.toFixed(2);
            if (price >= 1) return price.toFixed(3);
            return price.toFixed(5);
        }
        
        async function analyze() {
            const symbol = document.getElementById('symbol').value;
            const tf = document.getElementById('timeframe').value;
            const limit = tf === '1w' ? 104 : tf === '1d' ? 365 : 500;
            
            try {
                const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${tf}&limit=${limit}`);
                const data = await res.json();
                
                const candles = data.map(c => ({
                    time: c[0] / 1000,
                    open: parseFloat(c[1]),
                    high: parseFloat(c[2]),
                    low: parseFloat(c[3]),
                    close: parseFloat(c[4])
                }));
                
                const price = candles[candles.length - 1].close;
                
                // Berechnungen
                const zielMin = price * 1.12;
                const zielMax = price * 1.20;
                const erwartung = (zielMin + zielMax) / 2;
                const stop = price * 0.92;
                
                // Chart
                if (chart) chart.remove();
                chart = LightweightCharts.createChart(document.getElementById('chart'), {
                    layout: { 
                        background: { color: '#111218' }, 
                        textColor: '#6b7280'
                    },
                    grid: { 
                        vertLines: { color: 'rgba(255,255,255,0.05)' }, 
                        horzLines: { color: 'rgba(255,255,255,0.05)' } 
                    },
                    rightPriceScale: { 
                        borderColor: '#1f2129',
                        scaleMargins: { top: 0.1, bottom: 0.1 }
                    },
                    timeScale: { 
                        borderColor: '#1f2129',
                        timeVisible: false,
                        tickMarkFormatter: (time) => {
                            const date = new Date(time * 1000);
                            const months = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
                            return months[date.getMonth()];
                        }
                    },
                    height: 350,
                    crosshair: { mode: 0 }
                });
                
                // ZIELZONEN-BOX (grüner Bereich) mit Background Series
                const zielBoxTop = zielMax;
                const zielBoxBottom = zielMin;
                
                // GRÜNE BOX im Chart (als Hintergrund)
                const boxDataTop = [];
                const boxDataBottom = [];
                const lastTime = candles[candles.length - 1].time;
                const timeStep = candles[1].time - candles[0].time;
                const futureSteps = 50;
                const futureTime = lastTime + (timeStep * futureSteps);
                
                for (let i = 0; i <= futureSteps; i++) {
                    const t = lastTime + (timeStep * i);
                    boxDataTop.push({ time: t, value: zielBoxTop });
                    boxDataBottom.push({ time: t, value: zielBoxBottom });
                }
                
                // Box-Bereich füllen
                const boxTopLine = chart.addLineSeries({ 
                    color: 'rgba(34, 197, 94, 0.3)', 
                    lineWidth: 0,
                    lastValueVisible: false
                });
                const boxBottomLine = chart.addLineSeries({ 
                    color: 'rgba(34, 197, 94, 0.3)', 
                    lineWidth: 0,
                    lastValueVisible: false
                });
                
                // HAUPTLINIE
                const mainLine = chart.addLineSeries({ 
                    color: '#ffffff', 
                    lineWidth: 1.5,
                    lastValueVisible: false
                });
                mainLine.setData(candles.map(c => ({ time: c.time, value: c.close })));
                
                // ZIELZONE OBEN (Linie mit Label)
                const zielTopLine = chart.addLineSeries({ 
                    color: '#22c55e', 
                    lineWidth: 2,
                    lineStyle: 0,
                    lastValueVisible: true,
                    title: '$' + formatPrice(zielMax)
                });
                zielTopLine.setData([
                    {time: lastTime, value: zielMax}, 
                    {time: futureTime, value: zielMax}
                ]);
                
                // ZIELZONE UNTEN (Linie)
                const zielBottomLine = chart.addLineSeries({ 
                    color: 'rgba(34, 197, 94, 0.6)', 
                    lineWidth: 1,
                    lineStyle: 2,
                    lastValueVisible: true,
                    title: '$' + formatPrice(zielMin)
                });
                zielBottomLine.setData([
                    {time: lastTime, value: zielMin}, 
                    {time: futureTime, value: zielMin}
                ]);
                
                // GELBE DURCHGEZOGENE HAUPTLINIE
                const primaryLine = chart.addLineSeries({ 
                    color: '#eab308', 
                    lineWidth: 3,
                    lineStyle: 0,
                    lastValueVisible: true,
                    title: 'Wahrscheinlich'
                });
                
                const primaryData = [];
                for (let i = 0; i <= futureSteps; i++) {
                    const t = lastTime + (timeStep * i);
                    const progress = i / futureSteps;
                    const p = price + (erwartung - price) * progress;
                    primaryData.push({ time: t, value: p });
                }
                primaryLine.setData(primaryData);
                
                // STOP LOSS
                const stopLine = chart.addLineSeries({ 
                    color: 'rgba(239, 68, 68, 0.6)', 
                    lineWidth: 1,
                    lineStyle: 2,
                    lastValueVisible: true,
                    title: 'Stop'
                });
                stopLine.setData([
                    {time: lastTime, value: stop}, 
                    {time: futureTime, value: stop}
                ]);
                
                // ÜBERGEORDNETE WELLENZÄHLUNGEN (große Zahlen)
                const wavePivots = [];
                for (let i = 10; i < candles.length - 10; i++) {
                    const isHigh = candles.slice(i-10, i).every(d => d.high <= candles[i].high) &&
                                  candles.slice(i+1, i+11).every(d => d.high < candles[i].high);
                    const isLow = candles.slice(i-10, i).every(d => d.low >= candles[i].low) &&
                                 candles.slice(i+1, i+11).every(d => d.low > candles[i].low);
                    if (isHigh && wavePivots.filter(p => p.type === 'high').length < 3) {
                        wavePivots.push({ time: candles[i].time, price: candles[i].high, type: 'high' });
                    }
                    if (isLow && wavePivots.filter(p => p.type === 'low').length < 2) {
                        wavePivots.push({ time: candles[i].time, price: candles[i].low, type: 'low' });
                    }
                }
                
                // Sortieren nach Zeit
                wavePivots.sort((a, b) => a.time - b.time);
                
                // Große Wellen-Marker (1, 2, 3, 4, 5)
                const waveMarkers = wavePivots.slice(0, 5).map((p, idx) => ({
                    time: p.time,
                    position: p.type === 'high' ? 'aboveBar' : 'belowBar',
                    color: idx === 2 ? '#eab308' : '#3b82f6',
                    shape: 'text',
                    text: (idx + 1).toString(),
                    size: 2
                }));
                
                // Kleine Wellen (i, ii, iii, iv, v)
                const subPivots = [];
                for (let i = 5; i < candles.length - 5; i++) {
                    const isHigh = candles.slice(i-5, i).every(d => d.high <= candles[i].high) &&
                                  candles.slice(i+1, i+6).every(d => d.high < candles[i].high);
                    const isLow = candles.slice(i-5, i).every(d => d.low >= candles[i].low) &&
                                 candles.slice(i+1, i+6).every(d => d.low > candles[i].low);
                    if (isHigh) subPivots.push({ time: candles[i].time, type: 'high' });
                    if (isLow) subPivots.push({ time: candles[i].time, type: 'low' });
                }
                
                subPivots.sort((a, b) => a.time - b.time);
                const subMarkers = subPivots.slice(-5).map((p, idx) => ({
                    time: p.time,
                    position: p.type === 'high' ? 'aboveBar' : 'belowBar',
                    color: '#6b7280',
                    shape: 'text',
                    text: ['(i)', '(ii)', '(iii)', '(iv)', '(v)'][idx],
                    size: 1
                }));
                
                mainLine.setMarkers([...waveMarkers, ...subMarkers]);
                
                chart.timeScale().fitContent();
                
                // BOTTOM ZONEN
                document.getElementById('currentPrice').textContent = '$' + formatPrice(price);
                document.getElementById('zielZone').textContent = formatPrice(zielMin) + '-' + formatPrice(zielMax);
                document.getElementById('erwartungsWert').textContent = formatPrice(erwartung);
                document.getElementById('stopLoss').textContent = formatPrice(stop);
                
            } catch (e) {
                console.error(e);
            }
        }
        
        window.onload = analyze;
    </script>
</body>
</html>
